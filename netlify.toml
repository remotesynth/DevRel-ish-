[build]
# Push schema changes to Turso before each build, then build the site.
# Requires ASTRO_DB_REMOTE_URL and ASTRO_DB_APP_TOKEN to be set in Netlify.
command = "astro db push --remote && astro build --remote"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Astro hashes all filenames in /_astro/ — safe to cache indefinitely.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts and other public static assets.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
